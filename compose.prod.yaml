services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-app}-php:prod
    build:
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  db:
    restart: unless-stopped
    volumes:
      - db_data_prod:/var/lib/postgresql/data

volumes:
  db_data_prod:
