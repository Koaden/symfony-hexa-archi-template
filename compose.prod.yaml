services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-app}-php:prod
    build:
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  db:
    restart: unless-stopped
    volumes:
      - db_data_prod:/var/lib/postgresql

  db-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - db_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >
      while true; do
        pg_dump -Fc -f /backups/db-$$(date +%Y%m%d-%H%M%S).dump;
        find /backups -maxdepth 1 -type f -name '*.dump' -mtime +7 -delete;
        sleep 86400;
      done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_prod:
  db_backups:
