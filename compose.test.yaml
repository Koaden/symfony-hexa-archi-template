services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-app}-php:test
    build:
      target: test
    environment:
      APP_ENV: test
      APP_SECRET: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test?serverVersion=18&charset=utf8

  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB}_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}_test"]
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
