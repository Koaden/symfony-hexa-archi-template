services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-app}-php:dev
    build:
      target: dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/symfony:/app/apps/symfony:rw
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      FRANKENPHP_CONFIG: ""

  db:
    ports:
      - "5432:5432"
