services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-app}-php:dev
    build:
      target: dev
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./apps/symfony:/app/apps/symfony:rw
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      FRANKENPHP_CONFIG: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    develop:
      watch:
        - action: sync+exec
          path: ./apps/symfony/composer.lock
          target: /app/apps/symfony/composer.lock
          exec:
            command: composer install --no-interaction
        - action: sync+exec
          path: ./apps/symfony/importmap.php
          target: /app/apps/symfony/importmap.php
          exec:
            command: php bin/console importmap:install --no-interaction

  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
